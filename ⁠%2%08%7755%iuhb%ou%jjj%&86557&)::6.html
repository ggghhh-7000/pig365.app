<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pig365 - 主控台</title>
    <script>
        // 防護：若未登入直接開啟此網址，跳轉回登入頁
        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = '/auth';
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f7;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            padding: 12px;
            background: #007aff;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
        .logout-btn {
            margin-top: 20px;
            background: none;
            border: none;
            color: #ff3b30;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>歡迎進入 Pig365</h1>
        <p>這裏是隱密首頁</p>
        
        <div class="btn-group">
            <a href="/ss" class="btn">PigSS</a>
            <a href="/ww" class="btn">PigWW</a>
            <a href="/ue" class="btn">PigUe</a>
        </div>

        <button class="logout-btn" onclick="logout()">登出</button>
    </div>

    <script>
        function logout() {
            sessionStorage.removeItem('isLoggedIn');
            sessionStorage.removeItem('currentUser');
            window.location.href = '/auth';
        }
    </script>
</body>
</html>
