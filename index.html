<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pig365-apps-SS / WW / Ue</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 1.25rem;
            color: #333;
            margin-bottom: 1.5rem;
            word-break: break-all;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background-color: #007aff;
            border: none;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>pig365-apps-SS / WW / Ue</h1>
        <div class="btn-group">
            <!-- 部署完其他子專案後，可將 href 改為子網站的正式網址（如 https://ss-pig365.pages.dev） -->
            <a href="https://ss-pig365.pages.dev" class="btn" target="_blank" rel="noopener noreferrer">PigSS</a>
            <a href="https://ww-pig365.pages.dev" class="btn" target="_blank" rel="noopener noreferrer">PigWW</a>
            <a href="https://ue-pig365.pages.dev" class="btn" target="_blank" rel="noopener noreferrer">PigUe</a>
        </div>
    </div>

</body>
</html>
